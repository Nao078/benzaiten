[package]
name = "benzaiten"
version = "0.1.0"
edition = "2021"
description = "Local desktop lyrics alignment and LRC editor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
hound = "3.5"
unicode-normalization = "0.1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rodio = "0.21.1"
rfd = "0.15"
lofty = "=0.25.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# 音声前処理・変換で使う実装（外部ffmpegバイナリへの依存を排除するため）。
# デコードは純Rust（Symphonia）、FLACエンコードも純Rust（flacenc）。
# MP3エンコードはLAME（LGPL、GPLのffmpegよりはるかに再配布条件が軽い）
# へのバインディングを使う。
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav"] }
rubato = "0.16"
flacenc = "0.5"
mp3lame-encoder = "0.2"

# `ort` の配布済みバイナリは MSVC 向けのみなので、同梱の GNU 版 Rustで
# Windowsビルドするときは onnxruntime.dll を実行時に読み込む。
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-25"] }

[target.'cfg(not(all(target_os = "windows", target_env = "gnu")))'.dependencies]
ort = { version = "=2.0.0-rc.13" }

# M4A（AAC）変換専用。OS標準搭載のMedia Foundation AACエンコーダを直接
# 呼び出すため、追加のバイナリ配布や第三者ライブラリのライセンス条件が
# 発生しない（このアプリはWindows専用なので、target_os依存にしている）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    "Win32_System_Com",
] }

[[bin]]
name = "benzaiten"
path = "src/main.rs"

[[bin]]
name = "benzaiten-cli"
path = "src/bin/benzaiten-cli.rs"
